    <title>Peluquería Armando</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un destello del otro tema.
      (function () {
        var t = null;
        try { t = localStorage.getItem('pa_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
